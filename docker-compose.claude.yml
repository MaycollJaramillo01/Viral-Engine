# Forma de ejecución usando la suscripción de Claude (Pro / Max / Team) como LLM Provider.
#
# Diferencias con docker-compose.release.yml:
#   1. compila Dockerfile.claude, y el contenedor incluye el claude CLI;
#   2. monta todo el directorio del proyecto, para que el código del Provider claude_code tenga efecto;
#   3. inyecta CLAUDE_CODE_OAUTH_TOKEN; el contenedor no tiene keychain y el CLI solo puede usar
#      `claude setup-token` el token de larga duración generado para autenticarse.
#
# Antes de arrancar, exporta el token:
#   export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"
#   docker compose -f docker-compose.claude.yml up -d --build

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile.claude

x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo

x-common-environment: &common-environment
  # Si el token no está definido, compose da error directamente, para no fallar en la fase de generación con el contenedor ya en marcha.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run 'export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"' first}

services:
  webui:
    build: *common-build
    container_name: "moneyprinterturbo-webui"
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    environment: *common-environment
    restart: always
  api:
    build: *common-build
    container_name: "moneyprinterturbo-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    environment: *common-environment
    restart: always
