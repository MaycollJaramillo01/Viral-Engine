name: 🐛 Bug | Bug Report
description: Reportar un error o problema | Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **Antes de enviar un problema, asegúrate de haber leído la siguiente documentación: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-) o [Inicio rápido (español)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#inicio-rápido-).**
        
        **Before submitting an issue, please make sure you've read the following documentation: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-) or [Inicio rápido (Chinese)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B-).**
        
  - type: textarea
    attributes:
      label: Descripción del problema | Current Behavior
      description: |
        Describe el problema que encontraste
        Describe the issue you're experiencing
      placeholder: |
        Cuando ejecuto la operación..., el programa presenta el problema...
        When I perform..., the program shows...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Pasos para reproducir | Steps to Reproduce
      description: |
        Describe en detalle cómo reproducir este problema
        Describe in detail how to reproduce this issue
      placeholder: |
        1. Abrir...
        2. Hacer clic en...
        3. Aparece el error...
        
        1. Open...
        2. Click on...
        3. Error occurs...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Registro de errores | Error Logs
      description: |
        Proporciona la información de error o los registros relevantes (no incluyas información sensible)
        Please provide any error messages or logs (be careful not to include sensitive information)
      placeholder: |
        Mensaje de error, registros o capturas de pantalla...
        Error messages, logs, or screenshots...
    validations:
      required: true
  - type: input
    attributes:
      label: Python Versión | Python Version
      description: |
        Versión de Python que usas
        The Python version you're using
      placeholder: v3.13.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Sistema operativo | Operating System
      description: |
        Información de tu sistema operativo
        Your operating system information
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: MoneyPrinterTurbo Versión | Version
      description: |
        Versión de MoneyPrinterTurbo que usas
        The version of MoneyPrinterTurbo you're using
      placeholder: v1.2.2, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Información adicional | Additional Information
      description: |
        Cualquier otra información útil para resolver el problema (capturas de pantalla, videos, etc.)
        Any other information that might help solve the issue (screenshots, videos, etc.)
    validations:
      required: false