name: ✨ Nueva funcionalidad | Feature Request
description: Propón una nueva idea o sugerencia para este proyecto | Suggest a new idea for this project
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    attributes:
      label: Descripción de la necesidad | Problem Statement
      description: |
        Describe el problema o la necesidad que quieres resolver 
        Please describe the problem you want to solve
      placeholder: |
        Durante el uso me encontré con...
        I encountered... when using this project
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solución propuesta | Proposed Solution
      description: |
        Describe la solución o forma de implementación que consideras viable
        Please describe your suggested solution or implementation
      placeholder: |
        Se podría añadir la funcionalidad... para resolver este problema
        Consider adding... feature to address this issue
    validations:
      required: true