# Notas:
# 1. las fuentes de las dependencias principales se centralizan en pyproject.toml.
# 2. el entorno de ejecución se fija con uv.lock, para que distintas máquinas no resuelvan combinaciones de versiones distintas.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mpt"
version = "1.3.9"
description = "Official MoneyPrinterTurbo package with WebUI and CLI, maintained by harry0703."
readme = "docs/pypi-description.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.66.1",
    # Keep the media-response compatibility test passing with the patched stack.
    "starlette==1.3.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.3.1",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    # Coherente con requirements.txt: PyAV 19 eliminó parámetros que usa Whisper.
    "av<19",
    "toml==0.10.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.30",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.103.1",
    "google-genai==2.11.0",
    "pyjwt[crypto]>=2.10.1,<3",
    "filelock>=4.2.1,<5",
    # Modelado y dibujo de subtítulos en alfabeto árabe (HarfBuzz + FreeType, incluidos en el wheel, sin bibliotecas del sistema).
    "khatt[video]==0.4.0",
]

[project.scripts]
mpt = "app.launcher:main"

[project.urls]
Homepage = "https://github.com/harry0703/MoneyPrinterTurbo"
Issues = "https://github.com/harry0703/MoneyPrinterTurbo/issues"

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI Primero hay que añadir el directorio raíz del proyecto a sys.path, y luego se puede importar el paquete app.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Medir la cobertura de ramas permite detectar casos en que «la línea de código se ejecutó, pero la otra rama de la condición nunca se verificó»,
# y es mejor base de calidad para la CI que medir solo la cobertura de líneas. El CLI y la WebUI son entradas de producción,
# así que se incluyen en la medición junto con la capa de servicios de app, la entrada de arranque del servicio y los scripts de Skill publicados para usuarios de Agent
# , para que la cobertura no refleje solo módulos parciales.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Python 3.11 y 3.13, con pruebas completas, superan en mediciones reales el 70.4 % de cobertura de ramas. Tomar 70%
# como suelo estable permite consolidar las pruebas de estado de fallo, recuperación de publicación asíncrona y actualización atómica de Redis,
# dejando margen para pequeñas diferencias de ramas entre versiones de Python y sistemas operativos.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app", "webui"]

# Se conservan las fuentes por defecto para chino e inglés y la fuente vietnamita. Los dos pesos alternativos de gran tamaño no entran en el paquete de instalación,
# para que el wheel no supere el límite de tamaño de archivo por defecto de PyPI; los archivos de fuentes de la versión de código fuente se mantienen igual.
[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "app/cli.py"
"config.example.toml" = "app/_assets/config.example.toml"
"resource/fonts/STHeitiMedium.ttc" = "app/_assets/resource/fonts/STHeitiMedium.ttc"
"resource/fonts/MicrosoftYaHeiBold.ttc" = "app/_assets/resource/fonts/MicrosoftYaHeiBold.ttc"
"resource/fonts/BeVietnamPro-Bold.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Bold.ttf"
"resource/fonts/BeVietnamPro-Medium.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Medium.ttf"
"resource/fonts/Charm-Bold.ttf" = "app/_assets/resource/fonts/Charm-Bold.ttf"
"resource/fonts/Charm-Regular.ttf" = "app/_assets/resource/fonts/Charm-Regular.ttf"
"resource/fonts/UTM Kabel KT.ttf" = "app/_assets/resource/fonts/UTM Kabel KT.ttf"
"resource/songs" = "app/_assets/resource/songs"
"resource/public" = "app/_assets/resource/public"

[tool.hatch.build]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc", "**/.streamlit"]

[tool.hatch.build.targets.sdist]
# Usa una lista blanca, prohibiendo que la configuración local, credenciales, storage, AGENTS.md y similares se mezclen en el paquete de código fuente.
include = [
    "/app", "/cli.py", "/webui", "/config.example.toml", "/pyproject.toml",
    "/uv.lock", "/LICENSE", "/docs/pypi-description.md", "/docs/packaging.md",
    "/test/services/test_packaging.py", "/resource/songs", "/resource/public",
    "/resource/fonts/STHeitiMedium.ttc", "/resource/fonts/MicrosoftYaHeiBold.ttc",
    "/resource/fonts/BeVietnamPro-Bold.ttf", "/resource/fonts/BeVietnamPro-Medium.ttf",
    "/resource/fonts/Charm-Bold.ttf", "/resource/fonts/Charm-Regular.ttf",
    "/resource/fonts/UTM Kabel KT.ttf",
]

[tool.uv]
package = true
# MoviePy 2.2.1 caps Pillow below 12; patched Pillow is required for image decoding.
# Keep this in sync with requirements-security.txt for container/legacy installs.
override-dependencies = ["pillow>=13.0.0,<14"]
